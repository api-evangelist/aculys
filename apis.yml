name: Aculys
description: >-
  Aculys Pharma, Inc. is a Japanese clinical-stage biopharmaceutical company focused on
  neurological and psychiatric diseases where there is high unmet medical need. The company
  works to eliminate Japan's drug lag and drug loss by bringing innovative medicines already
  approved in Western markets to Japanese patients as early as possible. Its lead product is
  Spydia (diazepam nasal spray), Japan's first domestically developed intranasal anti-seizure
  agent, approved in June 2025 and administrable outside medical facilities. Originally funded
  by SoftBank Vision Fund (Series C, March 2025), Aculys was acquired by and became part of the
  Viatris Group in October 2025. Aculys publishes no public developer program, API, or technical
  documentation surface; this profile is maintained for network completeness and identity.
